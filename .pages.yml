  - name: "works"
    label: "Galerie prac"
    type: "file"
    path: "content/works.json"
    format: "json"
    fields:
      - name: "_note"
        label: "Instrukcja"
        type: "text"
        readonly: true
      - name: "styx"
        label: "Prace Styxa"
        description: "Kolejność na liście = kolejność w galerii. Najlepiej 8–10 prac."
        type: "object"
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: "id"
            label: "Identyfikator (unikalny, bez spacji)"
            type: "string"
          - name: "isPlaceholder"
            label: "Treść zastępcza (przykład)"
            description: "Zaznaczone = przykład. Wersja produkcyjna nie zbuduje się, dopóki zostaną przykłady. Odznacz po wpisaniu prawdziwej treści."
            type: "boolean"
          - name: "src"
            label: "Zdjęcie (pion 4:5, min. 1600 × 2000 px)"
            type: "image"
            required: true
            options:
              media: "works"
              extensions: ["jpg", "jpeg", "png", "webp"]
              rename: "safe"
          - name: "caption"
            label: "Tytuł pracy"
            type: "string"
          - name: "placement"
            label: "Miejsce na ciele"
            type: "string"
          - name: "style"
            label: "Styl"
            type: "string"
          - name: "year"
            label: "Rok"
            type: "number"
          - name: "alt"
            label: "Opis zdjęcia dla osób niewidomych"
            type: "text"
      - name: "wkrenta"
        label: "Prace Wkrenty"
        description: "Kolejność na liście = kolejność w galerii. Najlepiej 8–10 prac."
        type: "object"
