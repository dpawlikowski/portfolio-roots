          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: "id"
            label: "Identyfikator (unikalny, bez spacji)"
            type: "string"
          - name: "isPlaceholder"
            label: "Treść zastępcza (przykład)"
            description: "Zaznaczone = przykład. Wersja produkcyjna nie zbuduje się, dopóki zostaną przykłady. Odznacz po wpisaniu prawdziwej treści."
            type: "boolean"
          - name: "src"
            label: "Zdjęcie (pion 4:5, min. 1600 × 2000 px)"
            type: "image"
            required: true
            options:
              media: "works"
              extensions: ["jpg", "jpeg", "png", "webp"]
              rename: "safe"
          - name: "caption"
            label: "Tytuł pracy"
            type: "string"
          - name: "placement"
            label: "Miejsce na ciele"
            type: "string"
          - name: "style"
            label: "Styl"
